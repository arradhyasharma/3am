<!DOCTYPE html>
<html>
<head>
  <title>DECIDER</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="top-nav">
    <a href="index.html">TEXT SCRAMBLER</a>
    <a href="decider.html" class="active">DECISION MATRIX</a>
  </nav>

  <main class="container">
    <header>
      <h1>SYSTEM DECIDER</h1>
      <p class="subtitle">Input options into memory buffer. Run choice calculation.</p>
    </header>

    <div class="input-box">
      <input type="text" id="option-input" placeholder="Add variable (e.g. Pizza)..." />
      <button id="add-btn">ADD</button>
    </div>

    <ul class="options-list" id="options-list"></ul>

    <button id="decide-btn" class="full-btn">EXECUTE SELECTION</button>

    <div class="display-box">
      <div id="decide-output" class="output-text">SYSTEM STANDBY</div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
